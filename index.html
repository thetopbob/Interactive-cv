<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Mike's CV — Overworld</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="/src/style.css" />
    </head>
    <body>
        <div id="app">
            <header id="hud">
                <span class="hud-title">MIKE.CV</span>
                <p></p>
                <span class="hud-hint">WASD / Arrows to move · E to talk</span>
            </header>

            <div id="game-container"></div>

            <div id="dialog-overlay" class="hidden">
                <div id="dialog-box">
                    <div id="dialog-nameplate">
                        <span id="dialog-npc"></span>
                    </div>
                    <div id="dialog-content">
                        <h2 id="dialog-title"></h2>
                        <div id="dialog-body"></div>
                    </div>
                    <button id="dialog-close" aria-label="Close dialog">
                        ✕ [ESC]
                    </button>
                </div>
            </div>
        </div>

        <script type="module" src="/src/main.js"></script>
    </body>
</html>
